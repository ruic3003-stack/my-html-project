<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>粒子·幻境 v0.7 - 小米15优化</title>
<style>
    body { margin:0; overflow:hidden; background:#000; font-family: 'Microsoft YaHei', sans-serif; }
    canvas { display:block; }
    #title {
        position: absolute; top: 15px; left: 15px; color: #00f5ff; font-size: 22px;
        text-shadow: 0 0 20px #00f5ff; z-index: 100;
    }
    #status {
        position: absolute; top: 55px; left: 15px; color: #00ffaa; font-size: 14px; z-index: 100;
    }
    #gesture {
        position: absolute; top: 85px; left: 15px; color: #ffff00; font-size: 16px; font-weight: bold; z-index: 100;
    }
</style>
</head>
<body>
<div id="title">粒子·幻境 <span style="font-size:14px;">v0.7 小米15</span></div>
<div id="status">小米15优化加载中...</div>
<div id="gesture">当前手势：等待检测</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" crossorigin="anonymous"></script>

<script>
// ==================== 小米15优化参数 ====================
let scene, camera, renderer, particles;
const particleCount = 7200;           // 适合小米15性能
let targetHandPos = {x:0, y:0};
let currentHandPos = {x:0, y:0};
let currentGesture = "None";

initThree();
initMediaPipe();
animate();

function initThree() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.z = 9;

    renderer = new THREE.WebGLRenderer({ 
        antialias: true, 
        alpha: true,
        powerPreference: "high-performance"   // 小米15高性能模式
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(2);   // 小米15屏幕高DPI
    document.body.appendChild(renderer.domElement);

    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
        const r = Math.random() * 3.8 + 0.7;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        pos[i]   = r * Math.sin(phi) * Math.cos(theta);
        pos[i+1] = r * Math.sin(phi) * Math.sin(theta);
        pos[i+2] = r * Math.cos(phi);
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

    const mat = new THREE.PointsMaterial({
        size: 0.045,
        color: 0x00f5ff,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthTest: false
    });

    particles = new THREE.Points(geo, mat);
    scene.add(particles);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

// ==================== MediaPipe 极致低延迟 ====================
let handLandmarker, video;
async function initMediaPipe() {
    const vision = await visionBundle.createVision();
    
    handLandmarker = await vision.HandLandmarker.createFromOptions(vision, {
        baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
        },
        numHands: 1,
        runningMode: "VIDEO",
        minHandDetectionConfidence: 0.6,
        minHandPresenceConfidence: 0.6
    });

    document.getElementById('status').textContent = "✅ 小米15低延迟优化就绪";
    startCamera();
}

function startCamera() {
    video = document.createElement('video');
    video.style.display = 'none';
    document.body.appendChild(video);

    navigator.mediaDevices.getUserMedia({ 
        video: { 
            width: 480, 
            height: 360,      // 小米15上最优分辨率
            facingMode: "user",
            frameRate: { ideal: 30 }
        }
    })
    .then(stream => {
        video.srcObject = stream;
        video.play();
    })
    .catch(() => {
        document.getElementById('status').textContent = "❌ 摄像头失败 | 使用触摸模式";
    });
}

// 快速手势检测
function detectGesture(landmarks) {
    if (!landmarks || landmarks.length < 21) return "None";
    
    const indexTip = landmarks[8];
    const thumbTip = landmarks[4];

    if (thumbTip.y < indexTip.y - 0.13) return "thumbsup";
    if (Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y) < 0.08) return "ok";
    if (indexTip.y > landmarks[6].y + 0.1) return "fist";

    return "point";
}

let lastTime = 0;
function processFrame() {
    if (!handLandmarker || !video) {
        requestAnimationFrame(processFrame);
        return;
    }

    const now = performance.now();
    if (now - lastTime > 10) {                    // 极高频率
        const results = handLandmarker.detectForVideo(video, now);
        
        if (results.landmarks?.length > 0) {
            const landmarks = results.landmarks[0];
            const gesture = detectGesture(landmarks);
            
            const tip = landmarks[8];
            targetHandPos.x = (tip.x - 0.5) * 17;
            targetHandPos.y = (0.5 - tip.y) * 13;

            currentGesture = gesture;
            document.getElementById('gesture').textContent = `当前手势：${getGestureName(gesture)}`;
        }
        lastTime = now;
    }
    requestAnimationFrame(processFrame);
}

function getGestureName(g) {
    if (g === "fist") return "握拳";
    if (g === "ok") return "OK手势";
    if (g === "thumbsup") return "拇指向上";
    return "食指指向";
}

// ==================== 动画循环 ====================
function animate() {
    requestAnimationFrame(animate);
    if (!particles) return;

    // 强平滑（小米15高刷屏体验更好）
    currentHandPos.x = currentHandPos.x * 0.65 + targetHandPos.x * 0.35;
    currentHandPos.y = currentHandPos.y * 0.65 + targetHandPos.y * 0.35;

    const positions = particles.geometry.attributes.position.array;
    let force = currentGesture === "fist" ? 0.042 : 
                currentGesture === "ok" ? 0.016 : 0.021;

    if (currentGesture === "point") force = 0.028;

    for (let i = 0; i < particleCount * 3; i += 3) {
        const dx = currentHandPos.x - positions[i];
        const dy = currentHandPos.y - positions[i + 1];
        const distSq = dx*dx + dy*dy + 1.8;

        positions[i]     += dx / distSq * force;
        positions[i + 1] += dy / distSq * force * 0.85;
        positions[i + 2] *= 0.982;
    }

    particles.rotation.y += 0.002;
    if (currentGesture === "ok") particles.rotation.z = Math.sin(Date.now() * 0.006) * 0.7;

    particles.geometry.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
}

function resetParticles() {
    const pos = particles.geometry.attributes.position.array;
    for (let i = 0; i < particleCount * 3; i += 3) {
        const r = Math.random() * 3.8 + 0.7;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        pos[i] = r * Math.sin(phi) * Math.cos(theta);
        pos[i+1] = r * Math.sin(phi) * Math.sin(theta);
        pos[i+2] = r * Math.cos(phi);
    }
    particles.geometry.attributes.position.needsUpdate = true;
}

// 启动
processFrame();
</script>
</body>
</html>
