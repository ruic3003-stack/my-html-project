<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D粒子手势系统 - 迷谳版</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: white; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        
        .panel {
            position: absolute; pointer-events: auto;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        #top-bar { top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        #loading-screen {
            position: fixed; inset: 0; background: #000; display: flex;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }

        .loader {
            width: 40px; height: 40px; border: 3px solid #333; border-top-color: #00f2fe;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #video-preview {
            position: fixed; bottom: 20px; right: 20px; width: 120px; height: 160px;
            border-radius: 12px; border: 2px solid rgba(255,255,255,0.2);
            overflow: hidden; transform: scaleX(-1); background: #111;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .btn {
            background: rgba(255,255,255,0.15); border: none; color: white;
            padding: 10px 18px; border-radius: 10px; font-size: 14px;
            transition: all 0.2s; pointer-events: auto;
        }
        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="loader"></div>
    <div id="status">正在初始化 AI 手势引擎...</div>
    <button class="btn" id="start-btn" style="display:none; margin-top:20px;">点击授权并开始</button>
</div>

<div id="ui-overlay">
    <div id="top-bar" class="panel">
        <div style="font-weight: bold; letter-spacing: 1px;">3D PARTICLE SYSTEM</div>
        <button class="btn" onclick="toggleFullScreen()">全屏</button>
    </div>
</div>

<div id="video-preview">
    <video id="input_video" playsinline></video>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

<script>
let scene, camera, renderer, points, geometry;
let currentPositions, targetPositions, colors;
const PARTICLE_COUNT = 18000;
const guiSettings = {
    shape: '星云',
    mainColor: '#00f2fe',
    showCamera: true,
    speed: 0.08,
    pSize: 0.025
};

// --- 文字矩阵生成辅助 ---
function getTextPoints(text) {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 200; canvas.height = 100;
    ctx.fillStyle = 'white';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(text, 100, 60);
    const data = ctx.getImageData(0, 0, 200, 100).data;
    const pts = [];
    for(let y=0; y<100; y+=2) {
        for(let x=0; x<200; x+=2) {
            if(data[(y*200+x)*4] > 128) {
                pts.push({x: (x-100)/20, y: (50-y)/20});
            }
        }
    }
    return pts;
}

const textData = getTextPoints("迷谳牛逼");

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    geometry = new THREE.BufferGeometry();
    currentPositions = new Float32Array(PARTICLE_COUNT * 3);
    targetPositions = new Float32Array(PARTICLE_COUNT * 3);
    colors = new Float32Array(PARTICLE_COUNT * 3);

    for(let i=0; i<PARTICLE_COUNT; i++) {
        const x = (Math.random() - 0.5) * 10;
        const y = (Math.random() - 0.5) * 10;
        const z = (Math.random() - 0.5) * 10;
        currentPositions[i*3] = x; currentPositions[i*3+1] = y; currentPositions[i*3+2] = z;
        targetPositions[i*3] = x; targetPositions[i*3+1] = y; targetPositions[i*3+2] = z;
        
        const color = new THREE.Color();
        color.setHSL(Math.random(), 0.8, 0.6);
        colors[i*3] = color.r; colors[i*3+1] = color.g; colors[i*3+2] = color.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: guiSettings.pSize,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: 0.8,
        depthWrite: false
    });

    points = new THREE.Points(geometry, material);
    scene.add(points);

    setupGUI();
    setupHands();
    animate();
}

function updateShape(type) {
    for(let i=0; i<PARTICLE_COUNT; i++) {
        let tx, ty, tz;
        if(type === '星云') {
            tx = (Math.random()-0.5)*10; ty = (Math.random()-0.5)*10; tz = (Math.random()-0.5)*10;
        } else if(type === '爱心') {
            const t = Math.random() * Math.PI * 2;
            tx = 16 * Math.pow(Math.sin(t), 3) / 10;
            ty = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) / 10;
            tz = (Math.random()-0.5)*0.5;
        } else if(type === '土星') {
            if(i < PARTICLE_COUNT * 0.6) { // 球体
                const u = Math.random(), v = Math.random();
                const theta = 2 * Math.PI * u, phi = Math.acos(2 * v - 1);
                tx = 1.5 * Math.sin(phi) * Math.cos(theta);
                ty = 1.5 * Math.sin(phi) * Math.sin(theta);
                tz = 1.5 * Math.cos(phi);
            } else { // 环
                const r = 2.5 + Math.random() * 1.0;
                const theta = Math.random() * Math.PI * 2;
                tx = r * Math.cos(theta); ty = r * Math.sin(theta); tz = (Math.random()-0.5)*0.2;
            }
        } else if(type === '文字') {
            const p = textData[i % textData.length];
            tx = p.x * 1.5; ty = p.y * 1.5; tz = (Math.random()-0.5)*0.2;
        }
        targetPositions[i*3] = tx; targetPositions[i*3+1] = ty; targetPositions[i*3+2] = tz;
    }
}

function setupHands() {
    const videoElement = document.getElementById('input_video');
    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    
    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults(results => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const lm = results.multiHandLandmarks[0];
            
            // 1. 食指控制旋转
            points.rotation.y += (lm[8].x - 0.5) * 0.15;
            points.rotation.x += (lm[8].y - 0.5) * 0.15;

            // 2. 缩放
            const dist = Math.hypot(lm[4].x - lm[20].x, lm[4].y - lm[20].y);
            const s = THREE.MathUtils.lerp(points.scale.x, dist * 5, 0.1);
            points.scale.set(s, s, s);

            // 3. 点赞判定 -> 变换文字
            if(lm[4].y < lm[3].y && lm[8].y > lm[7].y && lm[12].y > lm[11].y) {
                updateShape('文字');
            }
        }
    });

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 640, height: 480
    });
    
    document.getElementById('start-btn').style.display = 'block';
    document.getElementById('status').innerText = '就绪';
    document.getElementById('start-btn').onclick = () => {
        cameraUtils.start();
        document.getElementById('loading-screen').style.display = 'none';
    };
}

function setupGUI() {
    const gui = new lil.GUI({title: '调节面板'});
    gui.add(guiSettings, 'shape', ['星云', '爱心', '土星', '文字']).name('模型选择').onChange(updateShape);
    gui.addColor(guiSettings, 'mainColor').name('核心颜色').onChange(v => points.material.color.set(v));
    gui.add(guiSettings, 'showCamera').name('显示预览').onChange(v => document.getElementById('video-preview').style.display = v ? 'block' : 'none');
    gui.add(guiSettings, 'pSize', 0.01, 0.1).name('粒子大小').onChange(v => points.material.size = v);
}

function animate() {
    requestAnimationFrame(animate);
    const posAttr = geometry.attributes.position.array;
    for(let i=0; i<PARTICLE_COUNT*3; i++) {
        posAttr[i] += (targetPositions[i] - posAttr[i]) * guiSettings.speed;
    }
    geometry.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
}

function toggleFullScreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
</body>
</html>
