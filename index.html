<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极速手势粒子系统 - 优化版</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* 预览窗口优化：增加半透明圆角 */
        #video-container { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            width: 120px; 
            height: 90px; 
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 12px; 
            overflow: hidden; 
            transform: scaleX(-1);
            z-index: 10;
            background: #111;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        #ui-container { position: absolute; top: 15px; left: 15px; z-index: 100; }
        
        .fullscreen-btn { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            padding: 8px 15px; 
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            color: white; 
            border-radius: 20px; 
            cursor: pointer; 
            backdrop-filter: blur(5px);
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui-container"></div>
    <div id="video-container"><video id="video" playsinline></video></div>
    <button class="fullscreen-btn" onclick="toggleFullScreen()">全屏沉浸</button>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.17.0/dist/lil-gui.umd.min.js"></script>

    <script>
        let scene, camera, renderer, particles, geometry;
        let particleCount = 10000; // 优化粒子数量以平衡画质与性能
        let targetPositions = new Float32Array(particleCount * 3);
        let currentHandScale = 1.0;
        let lerpFactor = 0.15; // 灵敏度平滑因子（越大越跟手，越小越平滑）
        // --- 初始化 3D 渲染环境 ---
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: false }); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
            document.body.appendChild(renderer.domElement);

            geometry = new THREE.BufferGeometry();
            const startPositions = new Float32Array(particleCount * 3);
            for(let i=0; i<particleCount*3; i++) {
                startPositions[i] = (Math.random() - 0.5) * 15;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(startPositions, 3));

            const material = new THREE.PointsMaterial({
                size: 0.04,
                color: 0x00f2ff,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        // --- 形状切换逻辑 ---
        function setShape(type) {
            for (let i = 0; i < particleCount; i++) {
                let x, y, z;
                const i3 = i * 3;
                if (type === '爱心') {
                    const t = Math.random() * Math.PI * 2;
                    x = 16 * Math.pow(Math.sin(t), 3);
                    y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                    z = (Math.random() - 0.5) * 3;
                    targetPositions[i3] = x * 0.15;
                    targetPositions[i3+1] = y * 0.15;
                    targetPositions[i3+2] = z * 0.15;
                } else if (type === '土星') {
                    const isRing = Math.random() > 0.5;
                    if (isRing) {
                        const r = 2.8 + Math.random() * 0.8;
                        const angle = Math.random() * Math.PI * 2;
                        targetPositions[i3] = Math.cos(angle) * r;
                        targetPositions[i3+1] = (Math.random() - 0.5) * 0.15;
                        targetPositions[i3+2] = Math.sin(angle) * r;
                    } else {
                        const r = 1.8;
                        const phi = Math.acos(-1 + (2 * Math.random()));
                        const theta = Math.random() * Math.PI * 2;
                        targetPositions[i3] = r * Math.sin(phi) * Math.cos(theta);
                        targetPositions[i3+1] = r * Math.sin(phi) * Math.sin(theta);
                        targetPositions[i3+2] = r * Math.cos(phi);
                    }
                } else { // 球体
                    const r = 2.2;
                    const phi = Math.acos(-1 + (2 * i) / particleCount);
                    const theta = Math.sqrt(particleCount * Math.PI) * phi;
                    targetPositions[i3] = r * Math.cos(theta) * Math.sin(phi);
                    targetPositions[i3+1] = r * Math.sin(theta) * Math.sin(phi);
                    targetPositions[i3+2] = r * Math.cos(phi);
                }
            }
        }
        // --- 增强手势识别算法 ---
        const videoElement = document.getElementById('video');
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // 性能核心：设为0极大提升移动端响应速度
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(results => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                const dx = hand[4].x - hand[8].x;
                const dy = hand[4].y - hand[8].y;
                const distance = Math.hypot(dx, dy); // 稳定的2D欧几里得距离

                // 将手势距离平滑映射到缩放比例
                const targetScale = THREE.MathUtils.mapLinear(distance, 0.02, 0.25, 0.5, 3.5);
                currentHandScale += (targetScale - currentHandScale) * lerpFactor;
            } else {
                currentHandScale += (1.0 - currentHandScale) * 0.05; // 失去目标后平滑缩小
            }
        });

        // --- 实时动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            const posAttribute = geometry.attributes.position;
            const positions = posAttribute.array;

            for (let i = 0; i < particleCount * 3; i++) {
                const targetValue = targetPositions[i] * currentHandScale;
                positions[i] += (targetValue - positions[i]) * 0.12; // 缓动聚拢效果
            }

            posAttribute.needsUpdate = true;
            particles.rotation.y += 0.003;
            renderer.render(scene, camera);
        }

        // --- UI 与启动配置 ---
        function setupUI() {
            const gui = new lil.GUI({ container: document.getElementById('ui-container') });
            const settings = { 模型选择: '爱心', 粒子颜色: '#00f2ff', 灵敏度: 0.15 };
            gui.add(settings, '模型选择', ['爱心', '土星', '球体']).onChange(v => setShape(v));
            gui.addColor(settings, '粒子颜色').onChange(v => particles.material.color.set(v));
            gui.add(settings, '灵敏度', 0.05, 0.5).onChange(v => lerpFactor = v);
            setShape('爱心');
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 低分辨率摄像头输入（提升FPS的关键）
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 320, height: 240 
        });

        initThree();
        setupUI();
        cameraUtils.start();
        animate();
    </script>
</body>
</html>
