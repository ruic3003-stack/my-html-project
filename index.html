<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>粒子·幻境 v0.1</title>
<style>
    body { margin:0; overflow:hidden; background:#000; font-family: 'Microsoft YaHei', sans-serif; }
    canvas { display:block; }
    #ui {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 50px;
        display: flex; gap: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(0,245,255,0.3);
    }
    button {
        background: rgba(0,245,255,0.1); color: #00f5ff; border: 1px solid #00f5ff;
        padding: 8px 16px; border-radius: 30px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: rgba(0,245,255,0.3); }
    #title {
        position: absolute; top: 20px; left: 20px; color: #00f5ff; font-size: 22px;
        text-shadow: 0 0 20px #00f5ff;
    }
</style>
</head>
<body>
<div id="title">粒子·幻境 <span style="font-size:14px;">v0.1</span></div>
<div id="ui">
    <button onclick="resetParticles()">重新开始</button>
    <button onclick="toggleMode(0)">轨迹心</button>
    <button onclick="toggleMode(1)">全部环</button>
    <button onclick="toggleMode(2)">星云爆</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
// ==================== Three.js 核心 ====================
let scene, camera, renderer;
let particles, particlePositions, particleVelocities;
const particleCount = 12000;
let handPosition = new THREE.Vector3(0,0,0);
let mode = 0; // 0=球体, 1=环, 2=扩散

initThree();
initParticles();
initMediaPipe();
animate();

// Three.js 初始化
function initThree() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

// 粒子系统
function initParticles() {
    const geometry = new THREE.BufferGeometry();
    particlePositions = new Float32Array(particleCount * 3);
    particleVelocities = new Float32Array(particleCount * 3);

    for(let i = 0; i < particleCount * 3; i += 3) {
        const radius = Math.random() * 3 + 0.5;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        
        particlePositions[i]     = radius * Math.sin(phi) * Math.cos(theta);
        particlePositions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
        particlePositions[i + 2] = radius * Math.cos(phi);

        particleVelocities[i] = (Math.random() - 0.5) * 0.02;
        particleVelocities[i+1] = (Math.random() - 0.5) * 0.02;
        particleVelocities[i+2] = (Math.random() - 0.5) * 0.02;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

    const material = new THREE.PointsMaterial({
        size: 0.035,
        color: 0x00f5ff,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthTest: false
    });

    particles = new THREE.Points(geometry, material);
    scene.add(particles);
}

// MediaPipe 手部追踪
let hands;
function initMediaPipe() {
    hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults(onResults);

    const cameraElement = document.createElement('video');
    cameraElement.style.display = 'none';
    document.body.appendChild(cameraElement);

    new Camera(cameraElement, {
        onFrame: async () => { await hands.send({image: cameraElement}); },
        width: 640, height: 480
    }).start();
}

function onResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        
        // 使用食指指尖 + 手掌中心平均位置
        const indexTip = landmarks[8];
        const palm = landmarks[0];
        
        handPosition.x = (indexTip.x - 0.5) * 12;
        handPosition.y = (0.5 - indexTip.y) * 8;
        handPosition.z = -2;
    }
}

// 动画循环
function animate() {
    requestAnimationFrame(animate);

    const positions = particles.geometry.attributes.position.array;

    for(let i = 0; i < particleCount * 3; i += 3) {
        const x = positions[i];
        const y = positions[i+1];
        const z = positions[i+2];

        // 吸引力
        const dx = handPosition.x - x;
        const dy = handPosition.y - y;
        const dz = handPosition.z - z;
        const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;

        const force = mode === 2 ? -0.008 : 0.015; // 扩散模式反向力

        particleVelocities[i]   += dx / dist * force;
        particleVelocities[i+1] += dy / dist * force;
        particleVelocities[i+2] += dz / dist * force * 0.6;

        // 阻尼
        particleVelocities[i] *= 0.96;
        particleVelocities[i+1] *= 0.96;
        particleVelocities[i+2] *= 0.96;

        positions[i] += particleVelocities[i];
        positions[i+1] += particleVelocities[i+1];
        positions[i+2] += particleVelocities[i+2];

        // 边界限制 + 环形/球形倾向
        const currentDist = Math.sqrt(x*x + y*y + z*z);
        if (mode === 1 && currentDist > 0) { // 环模式
            positions[i] *= 0.995;
            positions[i+1] *= 0.995;
        }
    }

    particles.geometry.attributes.position.needsUpdate = true;
    particles.rotation.y += 0.0008;

    renderer.render(scene, camera);
}

// UI 控制
function resetParticles() {
    const positions = particles.geometry.attributes.position.array;
    for(let i = 0; i < particleCount * 3; i += 3) {
        const radius = Math.random() * 3 + 1;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i+1] = radius * Math.sin(phi) * Math.sin(theta);
        positions[i+2] = radius * Math.cos(phi);
    }
    particles.geometry.attributes.position.needsUpdate = true;
}

function toggleMode(m) {
    mode = m;
}
</script>
</body>
</html>
