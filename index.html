<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <!-- 针对手机端进行视口优化，防止页面放大变形 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 手机手势粒子系统</title>
    <style>
        /* 全屏无边框，背景设为深邃黑色 */
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* 右下角摄像头预览小窗口 */
        #video-container { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            width: 100px; 
            height: 75px; 
            border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 8px; 
            overflow: hidden; 
            transform: scaleX(-1); /* 镜像翻转，符合照镜子习惯 */
            z-index: 10;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 左上角现代UI控制面板容器 */
        #ui-container { position: absolute; top: 15px; left: 15px; z-index: 100; }
        
        /* 右上角现代全屏按钮 */
        .fullscreen-btn { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            padding: 10px 16px; 
            background: rgba(255, 255, 255, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.25); 
            color: white; 
            border-radius: 8px; 
            cursor: pointer; 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- UI 面板挂载点 -->
    <div id="ui-container"></div>
    
    <!-- 隐藏/小窗摄像头 -->
    <div id="video-container"><video id="video" playsinline></video></div>
    
    <!-- 全屏控制 -->
    <button class="fullscreen-btn" onclick="toggleFullScreen()">全屏模式</button>

    <!-- 预留位置：接下来引入核心 JS 库 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.17.0/dist/lil-gui.umd.min.js"></script>

    <script>
        let scene, camera, renderer, particles, geometry;
        let particleCount = 12000; // 粒子数量
        let targetPositions = new Float32Array(particleCount * 3); // 存储目标形状坐标
        let currentHandScale = 1.0; // 受手势影响的实时缩放比例

        // --- 1. 初始化 3D 渲染环境 ---
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 优化移动端性能
            document.body.appendChild(renderer.domElement);

            // 创建缓冲区几何体（BufferGeometry 性能最高）
            geometry = new THREE.BufferGeometry();
            const startPositions = new Float32Array(particleCount * 3);
            for(let i=0; i<particleCount*3; i++) {
                startPositions[i] = (Math.random() - 0.5) * 10;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(startPositions, 3));

            // 设置粒子材质（发光感）
            const material = new THREE.PointsMaterial({
                size: 0.035,
                color: 0x00ffff,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending, // 加法混合让重叠处更亮
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        // --- 2. 形状坐标计算函数 ---
        function setShape(type) {
            for (let i = 0; i < particleCount; i++) {
                let x, y, z;
                const i3 = i * 3;

                if (type === '爱心') {
                    const t = Math.random() * Math.PI * 2;
                    x = 16 * Math.pow(Math.sin(t), 3);
                    y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                    z = (Math.random() - 0.5) * 2;
                    // 缩放修正
                    targetPositions[i3] = x * 0.12;
                    targetPositions[i3+1] = y * 0.12;
                    targetPositions[i3+2] = z * 0.12;

                } else if (type === '土星') {
                    const isRing = Math.random() > 0.4;
                    if (isRing) { // 环
                        const r = 2.5 + Math.random() * 1.5;
                        const angle = Math.random() * Math.PI * 2;
                        targetPositions[i3] = Math.cos(angle) * r;
                        targetPositions[i3+1] = (Math.random() - 0.5) * 0.2;
                        targetPositions[i3+2] = Math.sin(angle) * r;
                    } else { // 球体
                        const r = 1.8;
                        const phi = Math.acos(-1 + (2 * Math.random()));
                        const theta = Math.random() * Math.PI * 2;
                        targetPositions[i3] = r * Math.sin(phi) * Math.cos(theta);
                        targetPositions[i3+1] = r * Math.sin(phi) * Math.sin(theta);
                        targetPositions[i3+2] = r * Math.cos(phi);
                    }
                } else if (type === '烟花') {
                    const r = Math.random() * 4;
                    const phi = Math.acos(-1 + (2 * Math.random()));
                    const theta = Math.random() * Math.PI * 2;
                    targetPositions[i3] = r * Math.sin(phi) * Math.cos(theta);
                    targetPositions[i3+1] = r * Math.sin(phi) * Math.sin(theta);
                    targetPositions[i3+2] = r * Math.cos(phi);
                } else { // 默认球体
                    const r = 2.5;
                    const phi = Math.acos(-1 + (2 * i) / particleCount);
                    const theta = Math.sqrt(particleCount * Math.PI) * phi;
                    targetPositions[i3] = r * Math.cos(theta) * Math.sin(phi);
                    targetPositions[i3+1] = r * Math.sin(theta) * Math.sin(phi);
                    targetPositions[i3+2] = r * Math.cos(phi);
                }
            }
        }
        // --- 3. 手势识别逻辑 ---
        const videoElement = document.getElementById('video');
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(results => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                
                // 计算大拇指尖 (4) 和 食指尖 (8) 的距离
                const dx = hand[4].x - hand[8].x;
                const dy = hand[4].y - hand[8].y;
                const dz = hand[4].z - hand[8].z;
                const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);

                // 将手势距离映射为缩放比例 (0.05-0.4 映射到 0.5-3.0)
                const targetScale = THREE.MathUtils.mapLinear(distance, 0.05, 0.4, 0.5, 3.0);
                currentHandScale = THREE.MathUtils.lerp(currentHandScale, targetScale, 0.2);
            } else {
                // 无手势时恢复默认大小
                currentHandScale = THREE.MathUtils.lerp(currentHandScale, 1.0, 0.05);
            }
        });

        // --- 4. 实时动画循环 ---
        function animate() {
            requestAnimationFrame(animate);

            const posAttribute = geometry.attributes.position;
            const positions = posAttribute.array;

            for (let i = 0; i < particleCount * 3; i++) {
                // 核心算法：当前位置向 (目标位置 * 手势缩放) 进行插值，实现平滑跟随
                const targetValue = targetPositions[i] * currentHandScale;
                positions[i] += (targetValue - positions[i]) * 0.1; 
            }

            posAttribute.needsUpdate = true;
            
            // 自动旋转背景，增加动感
            particles.rotation.y += 0.002;
            particles.rotation.x += 0.001;

            renderer.render(scene, camera);
        }

        // --- 5. UI 面板与交互配置 ---
        function setupUI() {
            const gui = new lil.GUI({ container: document.getElementById('ui-container') });
            const settings = {
                模型: '爱心',
                粒子颜色: '#00ffff',
                粒子大小: 0.035
            };

            gui.add(settings, '模型', ['爱心', '土星', '烟花', '球体']).onChange(v => setShape(v));
            gui.addColor(settings, '粒子颜色').onChange(v => particles.material.color.set(v));
            gui.add(settings, '粒子大小', 0.01, 0.1).onChange(v => particles.material.size = v);
            
            // 默认初始化形状
            setShape('爱心');
        }

        // --- 6. 辅助功能：全屏、适配、相机启动 ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => alert("全屏需要用户交互或设备支持"));
            } else {
                document.exitFullscreen();
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 启动摄像头
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 480, height: 360
        });

        // 执行启动
        initThree();
        setupUI();
        cameraUtils.start();
        animate();
    </script>
</body>
</html>
